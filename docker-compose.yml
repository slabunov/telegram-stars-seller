services:
  web:
    build:
      context: .
      secrets:
        - dotenv
    image: telegram-stars-seller:latest
    command: gunicorn config.asgi:application --bind 0.0.0.0:8000 -k uvicorn.workers.UvicornWorker --workers 2
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req = urllib.request.Request('http://localhost:8000/core/health/', headers={'X-Forwarded-Proto': 'https'}); res = urllib.request.urlopen(req, timeout=5); exit(0) if res.getcode() == 200 else exit(1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  bot:
    image: telegram-stars-seller:latest
    command: python manage.py runbot
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - persistence_pickle:/app/bot/data
    stop_grace_period: 25s
    restart: always
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery_worker:
    image: telegram-stars-seller:latest
    command: celery -A config worker --loglevel=info
    stop_grace_period: 120s
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery_beat:
    image: telegram-stars-seller:latest
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    restart: always
    depends_on:
      web:
        condition: service_healthy

volumes:
  sqlite_data:
  persistence_pickle:
  redis_data:

secrets:
  dotenv:
    file: .env
